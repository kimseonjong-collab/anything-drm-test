name: Windows Approved Installer

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/parsers/**'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/**'
      - '.github/workflows/windows-approved-installer.yml'
  workflow_dispatch:

jobs:
  installer:
    name: Build NSIS installer for approved deployment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout kordoc
        uses: actions/checkout@v4
        with:
          repository: chrisryugj/kordoc
          path: kordoc-src
          ref: 265b055bc977ccf35e150919ad49189b57e55ee8

      - name: Build kordoc dist
        working-directory: kordoc-src
        shell: pwsh
        run: |
          npm ci
          npm run build
          if (-not (Test-Path 'dist/cli.js')) {
            Write-Error 'kordoc build output (dist/cli.js) not found'
            exit 1
          }

      - name: Bundle kordoc into Tauri resources
        shell: pwsh
        run: |
          & scripts/bundle-kordoc.ps1 -KordocDir '${{ github.workspace }}/kordoc-src'

      - name: Download runtime models
        shell: pwsh
        run: |
          & scripts/download-model.ps1
          & scripts/download-vcredist.ps1

      - name: Build NSIS installer
        shell: pwsh
        run: pnpm exec tauri build

      - name: Prepare approval package
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $src = 'src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem $src -Filter '*setup.exe' | Where-Object { $_.Name -notmatch 'Lite' } | Select-Object -First 1
          if (-not $setup) {
            Write-Error "NSIS installer not found. Contents: $((Get-ChildItem $src -ErrorAction SilentlyContinue).Name -join ', ')"
            exit 1
          }

          $out = 'approval-package'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $setup.FullName (Join-Path $out $setup.Name) -Force

          $hash = Get-FileHash $setup.FullName -Algorithm SHA256
          @(
            'PR=24',
            "HEAD=$env:SOURCE_SHA",
            "FILE=$($setup.Name)",
            "SHA256=$($hash.Hash)",
            'PURPOSE=Organization-approved WDAC/Managed Installer deployment test for HWP DRM COM fallback',
            'SECURITY=No DRM bypass; preserves Hancom/Fasoo user access-consent prompt'
          ) | Set-Content (Join-Path $out 'APPROVAL-METADATA.txt') -Encoding UTF8

          Write-Host "Source HEAD: $env:SOURCE_SHA"
          Write-Host "Installer: $($setup.Name)"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload approved-deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anything-v3.8.21-PR24-WDAC-approval
          path: approval-package/
          retention-days: 7
          compression-level: 9
