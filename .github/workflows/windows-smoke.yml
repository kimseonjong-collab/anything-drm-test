name: Windows Smoke Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/parsers/wincom/**'
      - 'src-tauri/src/shutdown.rs'
      - '.github/workflows/windows-smoke.yml'

jobs:
  smoke:
    name: Portable Windows smoke artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Create minimal resource placeholders
        shell: pwsh
        run: |
          $r = "src-tauri/resources"
          New-Item -ItemType Directory -Force -Path "$r/kordoc","$r/paddleocr","$r/onnxruntime","$r/pdfium" | Out-Null
          New-Item -ItemType File -Force -Path "$r/node.exe","$r/kordoc/.gitkeep","$r/paddleocr/det.onnx","$r/paddleocr/rec.onnx","$r/paddleocr/dict.txt","$r/onnxruntime/onnxruntime.dll","$r/pdfium/pdfium.dll" | Out-Null

      - name: Build executable without installer bundle
        shell: pwsh
        run: pnpm exec tauri build --no-bundle
      - name: Assemble portable smoke folder
        shell: pwsh
        run: |
          $out = "smoke/Anything-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/release/docufinder.exe" "$out/Anything-smoke.exe"
          # Office COM shutdown test does not need kordoc/OCR/ONNX/PDFium resources.
          @"
          SMOKE TEST ONLY
          This is not an installer.
          Run Anything-smoke.exe only for the Office COM shutdown test.
          Existing Anything data under %APPDATA%\com.anything.app is reused.
          "@ | Set-Content "$out/README.txt"
      - name: Upload portable smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anything-v3.8.21-office-com-minimal
          path: smoke/Anything-smoke/
          retention-days: 3
          compression-level: 9
