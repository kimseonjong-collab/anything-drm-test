name: Windows Smoke Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/parsers/wincom/**'
      - 'src-tauri/src/shutdown.rs'
      - '.github/workflows/windows-smoke.yml'

jobs:
  smoke:
    name: Portable Windows smoke artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Prepare build resources
        shell: pwsh
        run: |
          npm ci --prefix kordoc-src 2>$null
        continue-on-error: true
      - name: Checkout kordoc
        uses: actions/checkout@v4
        with:
          repository: chrisryugj/kordoc
          path: kordoc-src
          ref: 265b055bc977ccf35e150919ad49189b57e55ee8
      - name: Build and bundle kordoc
        shell: pwsh
        run: |
          Push-Location kordoc-src
          npm ci
          npm run build
          Pop-Location
          & scripts/bundle-kordoc.ps1 -KordocDir "${{ github.workspace }}/kordoc-src"
      - name: Download models
        shell: pwsh
        run: |
          & scripts/download-model.ps1
          & scripts/download-vcredist.ps1
      - name: Build executable without installer bundle
        shell: pwsh
        run: pnpm exec tauri build --no-bundle
      - name: Assemble portable smoke folder
        shell: pwsh
        run: |
          $out = "smoke/Anything-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/release/docufinder.exe" "$out/Anything-smoke.exe"
          Copy-Item "src-tauri/resources" "$out/resources" -Recurse
          @"
          SMOKE TEST ONLY
          This is not an installer.
          Run Anything-smoke.exe only for the Office COM shutdown test.
          Existing Anything data under %APPDATA%\com.anything.app is reused.
          "@ | Set-Content "$out/README.txt"
      - name: Upload portable smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anything-v3.8.21-office-shutdown-smoke
          path: smoke/Anything-smoke/
          retention-days: 3
          compression-level: 9
